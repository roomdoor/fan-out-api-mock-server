services:
  
  mock-bank-00:
    build: ..
    ports:
      - "18000:18080"
    environment:
      - MOCK_SERVER_PORT=18080
      - MOCK_BANK_COUNT=50
      - MOCK_MIN_LATENCY_MS=${MOCK_MIN_LATENCY_MS:-500}
      - MOCK_MAX_LATENCY_MS=${MOCK_MAX_LATENCY_MS:-500}
      - MOCK_SLOW_MIN_LATENCY_MS=${MOCK_SLOW_MIN_LATENCY_MS:-500}
      - MOCK_SLOW_MAX_LATENCY_MS=${MOCK_SLOW_MAX_LATENCY_MS:-500}
      - MOCK_SLOW_BANK_COUNT=${MOCK_SLOW_BANK_COUNT:-0}
      - MOCK_SUCCESS_RATE_PERCENT=${MOCK_SUCCESS_RATE_PERCENT:-100}
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

